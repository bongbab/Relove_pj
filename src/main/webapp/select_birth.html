        <!-- 내 정보 -->

            >

            <label for="myHour">출생시간</label>
            <select id="myHour">
                <option value="-1">모름</option>
                <option value="0">00시</option>

                <option value="2">02시</option>

                <option value="18">18시</option>

                <option value="20">20시</option>
                <option value="21">21시</option>
                <option value="22">22시</option>
                <option value="23">23시</option>
            </select>

            <label for="myGender">성별</label>
            <select id="myGender">
                <option value="">선택</option>
                <option value="F">여성</option>
                <option value="M">남성</option>
            </select>
        </section>

        <!-- 상대방 정보 -->
        <section class="birth-section">
            <h2>상대방 정보</h2>

            <label for="partnerName">이름</label>
            <input
                type="text"
                id="partnerName"
                placeholder="이름 입력"
            >

            <label for="partnerBirth">생년월일</label>
            <input
                type="text"
    			id="partnerBirth"
    			placeholder="8자리 입력"

            >

            <label for="partnerHour">출생시간</label>
            <select id="partnerHour">
                <option value="-1">모름</option>

    <a href="index.html" class="homeBtn">
