<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RE:LOVE | 다시, 우리</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<header class="language-header">

    <a href="main.html" id="koLink">
        <svg class="flag-icon" viewBox="0 0 36 24" aria-hidden="true">
            <rect width="36" height="24" fill="#fff"/>
            <circle cx="18" cy="12" r="6" fill="#cd2e3a"/>
            <path d="M12 12a6 6 0 0 0 12 0a6 3 0 0 1-12 0z" fill="#0047a0"/>
        </svg>
        한국어
    </a>

    <span class="language-divider">|</span>

    <a href="main_jp.html" id="jpLink">
        <svg class="flag-icon" viewBox="0 0 36 24" aria-hidden="true">
            <rect width="36" height="24" fill="#fff"/>
            <circle cx="18" cy="12" r="6" fill="#bc002d"/>
        </svg>
        日本語
    </a>

</header>

<body>

    <main class="question-page">

        <section class="question-panel">

            <!-- 01 -->
            <div class="question-block">

                <div class="question-title">
                    <span class="number">01</span>
                    <h2>현재 두 사람의 관계는 어떤가요?</h2>
                </div>

                <div class="option-grid">

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="recent">
                        <span>최근 헤어졌어요</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="long">
                        <span>헤어진 지 오래됐어요</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="contact">
                        <span>아직 연락하고 있어요</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="noContact">
                        <span>연락이 완전히 끊겼어요</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="some">
                        <span>썸 / 연락 단계에서 끝났어요</span>
                    </label>

                </div>

            </div>


            <!-- 가운데 구분선 -->
            <div class="divider"></div>


            <!-- 02 -->
            <div class="question-block">

                <div class="question-title">
                    <span class="number">02</span>
                    <h2>무엇이 가장 궁금한가요?</h2>
                </div>

                <div class="option-grid">

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="mind">
                        <span>상대방도 아직 나를 생각할까?</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="reunion">
                        <span>다시 만날 가능성이 있을까?</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="contact">
                        <span>먼저 연락해도 될까?</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="newLove">
                        <span>상대에게 새로운 사람이 있을까?</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="future">
                        <span>앞으로 우리 관계는 어떻게 될까?</span>
                    </label>

                </div>

            </div>


            <button type="button" id="startBtn">
                카드 뽑으러 가기
                <span>→</span>
            </button>

        </section>

    </main>

    <script src="js/index.js"></script>

</body>
</html>
