<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RE:LOVE | 復縁占い</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<header class="language-header">

    <a href="index.html" id="koLink">
        <svg class="flag-icon" viewBox="0 0 36 24" aria-hidden="true">
            <rect width="36" height="24" fill="#fff"/>
            <circle cx="18" cy="12" r="6" fill="#cd2e3a"/>
            <path d="M12 12a6 6 0 0 0 12 0a6 3 0 0 1-12 0z" fill="#0047a0"/>
        </svg>
        한국어
    </a>

    <span class="language-divider">|</span>

    <a href="index_jp.html" id="jpLink">
        <svg class="flag-icon" viewBox="0 0 36 24" aria-hidden="true">
            <rect width="36" height="24" fill="#fff"/>
            <circle cx="18" cy="12" r="6" fill="#bc002d"/>
        </svg>
        日本語
    </a>

</header>

<body class="jp">

    <main class="question-page">

        <section class="question-panel">

            <!-- 01 -->
            <div class="question-block">

                <div class="question-title">
                    <span class="number">01</span>
                    <h2>現在、お二人はどのような関係ですか？</h2>
                </div>

                <div class="option-grid">

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="recent">
                        <span>最近別れました</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="long">
                        <span>別れてからしばらく経っています</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="contact">
                        <span>今も連絡を取っています</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="noContact">
                        <span>今はまったく連絡を取っていません</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="relationship"
                               value="some">
                        <span>付き合う前に関係が終わりました</span>
                    </label>

                </div>

            </div>


            <!-- 가운데 구분선 -->
            <div class="divider"></div>


            <!-- 02 -->
            <div class="question-block">

                <div class="question-title">
                    <span class="number">02</span>
                    <h2>一番気になることは何ですか？</h2>
                </div>

                <div class="option-grid">

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="mind">
                        <span>相手もまだ私のことを考えている？</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="reunion">
                        <span>復縁できる可能性はある？</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="contact">
                        <span>私から連絡してもいい？</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="newLove">
                        <span>相手に新しい恋人はいる？</span>
                    </label>

                    <label class="option">
                        <input type="radio"
                               name="question"
                               value="future">
                        <span>これから二人の関係はどうなる？</span>
                    </label>

                </div>

            </div>


            <button type="button" id="startBtn">
                タロットカードを引く
                <span>→</span>
            </button>

        </section>

    </main>

    <script src="js/select.js"></script>

</body>
</html>
