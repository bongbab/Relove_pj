<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RE:LOVE | タロットカードを選ぶ</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<header class="language-header">

    <a href="main.html" id="koLink">
        <svg class="flag-icon" viewBox="0 0 36 24" aria-hidden="true">
            <rect width="36" height="24" fill="#fff"/>
            <circle cx="18" cy="12" r="6" fill="#cd2e3a"/>
            <path d="M12 12a6 6 0 0 0 12 0a6 3 0 0 1-12 0z" fill="#0047a0"/>
        </svg>
        한국어
    </a>

    <span class="language-divider">|</span>

    <a href="main_jp.html" id="jpLink">
        <svg class="flag-icon" viewBox="0 0 36 24" aria-hidden="true">
            <rect width="36" height="24" fill="#fff"/>
            <circle cx="18" cy="12" r="6" fill="#bc002d"/>
        </svg>
        日本語
    </a>

</header>

<body class="jp">

    <main class="tarot-page">

        <section class="tarot-container">

            <div class="tarot-header">

                

                <h1>直感で惹かれるカードを1枚選んでください。</h1>

                <p class="tarot-description">
                    あなたの質問を心に思い浮かべながら<br>
                    一番惹かれるカードを1枚選んでください。
                </p>

            </div>


            <div class="tarot-info">
                選んだカード
                <strong id="selectedCount">0</strong>
                / 1
            </div>


            <section id="cardArea"
                     class="card-grid">
                <!-- JavaScriptで22枚生成 -->
            </section>


            <div class="tarot-buttons">

                <button type="button"
                        id="shuffleBtn"
                        class="secondary-btn">
                    シャッフル
                </button>

                <button type="button"
                        id="resultBtn"
                        class="primary-btn">
                    結果を見る
                    <span>→</span>
                </button>

            </div>

        </section>

    </main>

    <script src="js/tarot.js"></script>

</body>

</html>
